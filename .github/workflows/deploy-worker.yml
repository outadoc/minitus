name: Deploy Cloudflare Worker

# Déploie le Worker à chaque push sur main une fois la variable de dépôt DEPLOY_WORKER
# passée à "true", ou à la demande depuis l'onglet Actions.
#
# Le job s'exécute dans l'environnement GitHub Actions « production », qui porte les secrets :
#   - CLOUDFLARE_API_TOKEN : jeton d'API Cloudflare avec la permission « Workers Scripts: Edit »
#   - CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare
#
# DEPLOY_WORKER reste une variable de dépôt : la condition `if` d'un job est évaluée avant que
# son environnement ne soit chargé, elle ne peut donc pas lire les variables d'environnement.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: production

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        # Au premier déploiement d'un Worker, wrangler crée le script puis lit aussitôt sa
        # configuration workers.dev via l'API /workers/workers/<nom>, qui peut ne pas encore le
        # connaître et répondre « This Worker does not exist on your account » (code 10007).
        # wrangler ne réessaie pas cette erreur : on relance donc le déploiement une fois.
        run: |
          if ! npx wrangler deploy; then
            echo "::warning::Échec du déploiement, nouvelle tentative dans 15 secondes."
            sleep 15
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
